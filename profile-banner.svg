<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ravi Varma</title>
  <desc id="d">Data Science, AI Engineer, GenAI, Agentic AI. Building practical AI systems from data to models to applications to agents.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F6FEB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8957E5" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8957E5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D6F2"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363D" opacity="0.55"/>
    </pattern>

    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .sans { font-family: "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .label { font-size: 13.5px; fill: #8B949E; text-anchor: middle; }
      .label-end { font-size: 13.5px; fill: #E6EDF3; font-weight: 600; text-anchor: middle; }
      @media (prefers-reduced-motion: reduce) { .anim { display: none; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="12" fill="url(#dots)"/>
  <ellipse cx="1000" cy="40" rx="380" ry="200" fill="url(#glowBlue)"/>
  <ellipse cx="180" cy="330" rx="360" ry="170" fill="url(#glowPurple)"/>

  <!-- Faint network, upper right -->
  <g stroke="#58A6FF" stroke-opacity="0.28" stroke-width="1" fill="none">
    <path d="M840 78 L925 124 L1012 64 L1092 134"/>
    <path d="M925 124 L962 192 L1062 214 L1092 134"/>
    <path d="M1012 64 L962 192"/>
  </g>
  <g fill="#0D1117" stroke="#58A6FF" stroke-opacity="0.55" stroke-width="1.2">
    <circle cx="840" cy="78" r="4"/>
    <circle cx="925" cy="124" r="5"/>
    <circle cx="1012" cy="64" r="4"/>
    <circle cx="1092" cy="134" r="5"/>
    <circle cx="962" cy="192" r="4"/>
    <circle cx="1062" cy="214" r="4"/>
  </g>

  <!-- Name and positioning -->
  <text x="100" y="118" class="sans" font-size="78" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Ravi Varma</text>
  <text x="102" y="165" class="sans" font-size="23" font-weight="500" fill="#E6EDF3">Data Science  •  AI Engineer  •  GenAI  •  Agentic AI</text>
  <text x="102" y="200" class="sans" font-size="16" fill="#8B949E">Building practical AI systems, from data to models to applications to agents.</text>

  <!-- Pipeline -->
  <g>
    <!-- base line -->
    <line x1="100" y1="268" x2="1100" y2="268" stroke="#30363D" stroke-width="2"/>
    <!-- gradient line -->
    <line x1="100" y1="268" x2="1100" y2="268" stroke="url(#flow)" stroke-width="2" stroke-opacity="0.85"/>

    <!-- nodes -->
    <g fill="#0D1117" stroke-width="2">
      <circle cx="100"  cy="268" r="6" stroke="#58A6FF"/>
      <circle cx="225"  cy="268" r="6" stroke="#5F9FFA"/>
      <circle cx="350"  cy="268" r="6" stroke="#6A98F7"/>
      <circle cx="475"  cy="268" r="6" stroke="#7A90F4"/>
      <circle cx="600"  cy="268" r="6" stroke="#8A88F1"/>
      <circle cx="725"  cy="268" r="6" stroke="#977FF0"/>
      <circle cx="850"  cy="268" r="6" stroke="#A076F7"/>
      <circle cx="975"  cy="268" r="6" stroke="#A371F7"/>
    </g>

    <!-- final node: the complete system -->
    <circle cx="1100" cy="268" r="14" fill="#A371F7" opacity="0.35" filter="url(#soft)"/>
    <circle cx="1100" cy="268" r="10" fill="#0D1117" stroke="#A371F7" stroke-width="2.5"/>
    <circle cx="1100" cy="268" r="4" fill="#E6EDF3"/>
    <circle class="anim" cx="1100" cy="268" r="10" fill="none" stroke="#A371F7" stroke-width="1.5">
      <animate attributeName="r" values="10;26;10" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- travelling signal -->
    <g class="anim">
      <circle r="6" fill="#58A6FF" opacity="0.6" filter="url(#soft)">
        <animateMotion dur="6s" repeatCount="indefinite" path="M100,268 L1100,268"/>
      </circle>
      <circle r="3" fill="#FFFFFF">
        <animateMotion dur="6s" repeatCount="indefinite" path="M100,268 L1100,268"/>
      </circle>
    </g>

    <!-- labels -->
    <g class="sans">
      <text x="100"  y="302" class="label">Data</text>
      <text x="225"  y="302" class="label">Model</text>
      <text x="350"  y="302" class="label">API</text>
      <text x="475"  y="302" class="label">Application</text>
      <text x="600"  y="302" class="label">Tools</text>
      <text x="725"  y="302" class="label">Retrieval</text>
      <text x="850"  y="302" class="label">Agents</text>
      <text x="975"  y="302" class="label">Automation</text>
      <text x="1100" y="302" class="label-end">AI System</text>
    </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="12" fill="none" stroke="#30363D"/>
</svg>
